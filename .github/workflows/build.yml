name: Build & release Android app

# Every push to main builds a signed APK with a higher version and publishes it as a
# GitHub Release. Installed phones see the "Update available" pop-up and update in place.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Major.minor of the app; the patch number is the CI run number, so it always increases.
  VERSION_BASE: "2.1"
  # versionCode = offset + run number (must stay above every version already installed).
  VERSION_CODE_OFFSET: "100"

jobs:
  build:
    name: Test, build, sign & release
    runs-on: ubuntu-latest
    env:
      OT_KEYSTORE_PASSWORD: ${{ secrets.OT_KEYSTORE_PASSWORD }}
      OT_KEY_ALIAS: ${{ secrets.OT_KEY_ALIAS }}
      OT_KEY_PASSWORD: ${{ secrets.OT_KEY_PASSWORD }}
      # Optional: publish releases to another (public) repository, e.g. when this one is private.
      OT_RELEASE_REPO: ${{ vars.OT_RELEASE_REPO }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Compute version
        run: |
          CODE=$(( ${VERSION_CODE_OFFSET} + ${{ github.run_number }} ))
          NAME="${VERSION_BASE}.${{ github.run_number }}"
          echo "OT_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "OT_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Building version $NAME (code $CODE)"

      # The same signing key must be used for every build, otherwise Android refuses the update
      # ("App not installed as package conflicts with an existing package").
      - name: Restore signing keystore
        env:
          OT_KEYSTORE_BASE64: ${{ secrets.OT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OT_KEYSTORE_BASE64" ]; then
            echo "$OT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "OT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key restored."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::No signing key on pull requests - the APK is for testing only."
          else
            echo "::error::Secret OT_KEYSTORE_BASE64 is not set. Without a fixed signing key, phones cannot update the app. See README > Signing and releases."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/office-tracker-release.apk
          cd out && sha256sum office-tracker-release.apk > office-tracker-release.apk.sha256
          cat office-tracker-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: office-tracker-${{ env.OT_VERSION_NAME }}
          path: out/*
          retention-days: 30

      - name: Publish GitHub release (triggers the in-app update pop-up)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.OT_VERSION_NAME }}
          name: Office Tracker ${{ env.OT_VERSION_NAME }}
          target_commitish: ${{ vars.OT_RELEASE_REPO == '' && github.sha || '' }}
          repository: ${{ vars.OT_RELEASE_REPO || github.repository }}
          token: ${{ secrets.OT_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: out/*
          generate_release_notes: ${{ vars.OT_RELEASE_REPO == '' }}
          body: |
            ${{ github.event.head_commit.message }}
          make_latest: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
