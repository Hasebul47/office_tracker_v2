name: Build Android App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test, build & package
    runs-on: ubuntu-latest
    env:
      OT_KEYSTORE_PASSWORD: ${{ secrets.OT_KEYSTORE_PASSWORD }}
      OT_KEY_ALIAS: ${{ secrets.OT_KEY_ALIAS }}
      OT_KEY_PASSWORD: ${{ secrets.OT_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # The signing keystore lives only in GitHub secrets (never in the repository).
      # Secrets: OT_KEYSTORE_BASE64, OT_KEYSTORE_PASSWORD, OT_KEY_ALIAS, OT_KEY_PASSWORD
      - name: Restore signing keystore
        env:
          OT_KEYSTORE_BASE64: ${{ secrets.OT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OT_KEYSTORE_BASE64" ]; then
            echo "$OT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "OT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key restored."
          else
            echo "::warning::OT_KEYSTORE_BASE64 secret not set - APK will be signed with a throwaway debug key and cannot update installed apps."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/office-tracker-release.apk
          cd out && sha256sum office-tracker-release.apk > office-tracker-release.apk.sha256
          cat office-tracker-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: office-tracker-apk
          path: out/*
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          make_latest: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
